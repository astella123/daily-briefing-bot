name: Daily Briefing Bot

on:
  workflow_dispatch:  # Permette lancio manuale
  schedule:
    - cron: '0 5 * * *'  # 5:00 UTC = 7:00 italiane (ora legale)
  push:
    branches: [ main ]  # Si attiva anche con push ( workaround )
    
jobs:
  send-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python bot.py
